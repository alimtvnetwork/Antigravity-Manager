name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v4.102.0 on main branch, or v4.102.0-beta.1 on beta branch). Leave empty to auto-detect from package.json.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-target:
    name: Verify Branch & Release Type Compatibility
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
      release_type: ${{ steps.gate.outputs.release_type }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Validate Tag and Branch Alignment
        id: gate
        shell: bash
        run: |
          set -e

          # 1. 确定本次发布的 Tag 名称
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            echo "Using manual input tag: $TAG_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using git push tag: $TAG_NAME"
          else
            PKG_VERSION=$(jq -r '.version' package.json)
            TAG_NAME="v${PKG_VERSION}"
            echo "Auto-resolved tag from package.json: $TAG_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::❌ Invalid tag format: '$TAG_NAME'. Must conform to SemVer (e.g. v4.102.0 or v4.102.0-beta.1)!"
            exit 1
          fi

          # 2. 识别是否为预发布标签 (包含 '-')
          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
            RELEASE_TYPE="prerelease"
            echo "📋 Release category: Pre-release ($TAG_NAME)"
          else
            IS_PRERELEASE="false"
            RELEASE_TYPE="stable"
            echo "📋 Release category: Stable Release ($TAG_NAME)"
          fi

          # 3. 检查当前 commit 属于哪些远程分支
          CURRENT_COMMIT="${{ github.sha }}"
          BRANCHES=$(git branch -r --contains "$CURRENT_COMMIT" | sed 's/^[[:space:]]*origin\///' | tr '\n' ' ')
          echo "Commit $CURRENT_COMMIT belongs to remote branches: [ $BRANCHES ]"

          DISPATCH_BRANCH="${{ github.ref_name }}"

          # 4. 严格通道隔离门禁 (Main 纯净正式版 / Beta 专属预发布版)
          if [ "$IS_PRERELEASE" = "true" ]; then
            # 预发布版本只允许在 beta 分支发布，严禁在 main 分支单独发布！
            if echo "$BRANCHES" | grep -qw "beta" || [ "$DISPATCH_BRANCH" = "beta" ]; then
              echo "✅ Pre-release verification passed: target is linked to 'beta' branch."
            else
              echo "::error::❌ [Release Gate Intercept] Pre-release tag '$TAG_NAME' (containing '-') is strictly forbidden on 'main' branch! Pre-releases must be published from the 'beta' branch to keep 'main' purely stable."
              exit 1
            fi
          else
            # 正式版必须在 main 分支发布，严禁直接在 beta 分支发布正式版！
            if echo "$BRANCHES" | grep -qw "main" || [ "$DISPATCH_BRANCH" = "main" ]; then
              echo "✅ Stable release verification passed: target is linked to 'main' branch."
            else
              echo "::error::❌ [Release Gate Intercept] Stable release tag '$TAG_NAME' (without '-') must be published from the 'main' branch! Please merge 'beta' into 'main' first."
              exit 1
            fi
          fi

          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Rust setup (rustfmt only)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Release gate - Rust formatting must match CI
        shell: bash
        run: |
          cd src-tauri
          if ! cargo fmt -- --check; then
            echo "::error::[Release Gate Intercept] Tagged commit fails 'cargo fmt -- --check' (CI would be red). Run 'cd src-tauri && cargo fmt', commit, and re-tag."
            exit 1
          fi

  build-tauri:
    needs: verify-release-target
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target universal-apple-darwin --bundles app"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-24.04-arm"
            args: ""
          - platform: "windows-2022"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize Windows Runner I/O
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -ExclusionPath @(
            "${{ github.workspace }}",
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup",
            "$env:TEMP",
            "$env:LOCALAPPDATA\Temp"
          ) -ErrorAction SilentlyContinue

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils mold clang || (sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils mold clang)

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '') }}

      - name: Setup NASM
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/setup-nasm@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          cache-all-crates: "true"
          cache-targets: "true"

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater artifacts without signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "Updater signing key is configured; keeping updater artifacts enabled."
            exit 0
          }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "No updater signing key configured; disabled updater artifacts for this build."

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'ubuntu') && '-C linker=clang -C link-arg=-fuse-ld=mold' || '' }}
          CARGO_BUILD_JOBS: 4
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: npm run tauri build -- ${{ matrix.args }}

      # 3. 处理 macOS 架构重命名冲突 (解决 422 Already Exists)
      - name: Rename macOS assets for architecture
        if: matrix.platform == 'macos-latest'
        run: |
          # 识别架构
          if [[ "${{ matrix.args }}" == *"--target aarch64-apple-darwin"* ]]; then
            ARCH="aarch64"
          elif [[ "${{ matrix.args }}" == *"--target x86_64-apple-darwin"* ]]; then
            ARCH="x64"
          elif [[ "${{ matrix.args }}" == *"--target universal-apple-darwin"* ]]; then
            ARCH="universal"
          else
            ARCH="unknown"
          fi

          echo "Detected architecture: $ARCH"

          # 进入产物目录
          cd src-tauri/target/*/release/bundle/macos/

          # Rename .app.tar.gz and .sig to append architecture suffix
          for tar_file in *.app.tar.gz; do
            if [ -f "$tar_file" ] && [[ "$tar_file" != *"_${ARCH}.app.tar.gz"* ]]; then
              base="${tar_file%.app.tar.gz}"
              mv "$tar_file" "${base}_${ARCH}.app.tar.gz"
              if [ -f "${tar_file}.sig" ]; then
                mv "${tar_file}.sig" "${base}_${ARCH}.app.tar.gz.sig"
              fi
              echo "Renamed $tar_file to ${base}_${ARCH}.app.tar.gz"
            fi
          done

          # Package .app bundle into tar.gz if universal and no archive exists yet
          if [ "$ARCH" = "universal" ]; then
            for app_dir in *.app; do
              if [ -d "$app_dir" ] && [ ! -f "${app_dir%.app}_${ARCH}.app.tar.gz" ]; then
                base="${app_dir%.app}"
                tar -czf "${base}_${ARCH}.app.tar.gz" "$app_dir"
                echo "Packaged universal app bundle: ${base}_${ARCH}.app.tar.gz"
              fi
            done
          fi

          # Update updater json reference if present
          UPDATER_JSON="../../../updater/install.json"
          if [ ! -f "$UPDATER_JSON" ]; then
             UPDATER_JSON=$(find ../../../updater -name "*.json" | head -n 1)
          fi

          if [ -n "$UPDATER_JSON" ] && [ -f "$UPDATER_JSON" ]; then
            echo "Updating $UPDATER_JSON with renamed assets..."
            sed -i.bak "s/\.app\.tar\.gz/_${ARCH}.app.tar.gz/g" "$UPDATER_JSON" 2>/dev/null || true
          fi

      # 1. 上传 updater.json 到 Artifacts (供后续合并使用)
      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.platform }}-${{ strategy.job-index }}
          path: src-tauri/target/**/release/bundle/updater/*.json
          if-no-files-found: ignore
          retention-days: 1

      # 打包 Windows 便携版 ZIP (直接可执行文件免安装包)
      - name: Package portable binary archive (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            $ver = (Get-Content package.json | ConvertFrom-Json).version
          }
          $outDir = "src-tauri/target/release/bundle/zip"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exePath = "src-tauri/target/release/agm-alim.exe"
          if (-not (Test-Path $exePath)) {
            $found = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -notlike "*setup*" -and $_.Name -notlike "*build*" -and $_.Name -notlike "*agm.exe*" } | Select-Object -First 1
            if ($found) { $exePath = $found.FullName }
          }
          if (Test-Path $exePath) {
            $zipName = "agm-alim_${ver}_windows_x64.zip"
            $filesToZip = @($exePath)
            $cliPath = "src-tauri/target/release/agm.exe"
            if (Test-Path $cliPath) {
              $filesToZip += $cliPath
              Copy-Item -Path $cliPath -Destination "$outDir/agm.exe" -Force
            }
            Compress-Archive -Path $filesToZip -DestinationPath "$outDir/$zipName" -Force
            Copy-Item -Path $exePath -Destination "$outDir/agm-alim.exe" -Force
            Write-Host "Successfully packaged portable ZIP: $outDir/$zipName and standalone binaries"
          } else {
            Write-Warning "Executable not found for portable zip at $exePath"
          }

      # 2. 上传安装包到 Artifacts (供后续统一发布任务下载)
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/zip/*.zip
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.sig
            src-tauri/target/**/release/bundle/deb/*.sig
            src-tauri/target/**/release/bundle/appimage/*.sig
            src-tauri/target/**/release/bundle/msi/*.sig
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/rpm/*.sig
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    needs: [verify-release-target, build-tauri]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.verify-release-target.result == 'success' && needs.build-tauri.result != 'cancelled'
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载所有构建产物 (仅限 release 相关的 assets 和 updater)
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        env:
          VERSION: ${{ needs.verify-release-target.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Extracting release notes for version $VERSION"
          echo "## Quick Install ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Windows (PowerShell 5.1+)" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Direct Latest Install (Auto-Updating)" >> release_notes.md
          echo '```powershell' >> release_notes.md
          echo "irm https://raw.githubusercontent.com/${REPO}/main/install.ps1 | iex" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Pinned Version Install (${VERSION})" >> release_notes.md
          echo '```powershell' >> release_notes.md
          echo "irm https://raw.githubusercontent.com/${REPO}/${VERSION}/install.ps1 | iex" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Linux / macOS (Bash)" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Direct Latest Install (Auto-Updating)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/main/install.sh | bash" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Pinned Version Install (${VERSION})" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${VERSION}/install.sh | bash" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## What's New in ${VERSION}" >> release_notes.md
          echo "" >> release_notes.md
          CHANGELOG_SOURCE=""
          for candidate in "CHANGELOG_EN.md" "changelog_en.md" "CHANGELOG.md" "changelog.md"; do
            if [ -f "$candidate" ]; then
              CHANGELOG_SOURCE="$candidate"
              break
            fi
          done
          if [ -n "$CHANGELOG_SOURCE" ]; then
            awk -v ver="$VERSION" '
              BEGIN { capture=0 }
              $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
              capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
              capture { print }
            ' "$CHANGELOG_SOURCE" | sed 's/^[[:space:]]\{8\}//' >> release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "See the assets to download this version and install." >> release_notes.md
          fi
          # Enforce contributor isolation: Ensure only @aukgit is credited in release notes to prevent unwanted GitHub Release contributor attributions
          python3 -c '
          import re, pathlib
          p = pathlib.Path("release_notes.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              # Standardize all Thanks / 鸣谢 / 感谢 attributions strictly to @aukgit
              text = re.sub(r"[（(]\s*(?:Thanks to|鸣谢|感谢)\s*[^）)]*[)）]", "(Thanks to @aukgit)", text, flags=re.IGNORECASE)
              # Strip any raw @user mentions except @aukgit to prevent unwanted GitHub Release contributor listing
              text = re.sub(r"(?<![a-zA-Z0-9_.+-])@(?!(?:aukgit)\b)([a-zA-Z0-9_-]+)", r"\1", text)
              p.write_text(text, encoding="utf-8")
          '

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ needs.verify-release-target.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          # Helper: read signature content from .sig file in artifacts
          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          # Helper: resolve actual generated asset file name from artifacts
          get_asset_name() {
            local pattern="$1"
            local fallback="$2"
            local asset_file
            asset_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$asset_file" ] && [ -f "$asset_file" ]; then
              basename "$asset_file"
            else
              echo "$fallback"
            fi
          }

          # Read signatures for each platform
          MACOS_AARCH64_SIG=$(read_sig "*_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(read_sig "*_x64.app.tar.gz.sig")
          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          LINUX_AMD64_SIG=$(read_sig "*_amd64.AppImage.sig")
          LINUX_AARCH64_SIG=$(read_sig "*_aarch64.AppImage.sig")

          # Read matching asset filenames for each platform
          MACOS_AARCH64_ASSET=$(get_asset_name "*_aarch64.app.tar.gz" "agm-alim_aarch64.app.tar.gz")
          MACOS_X64_ASSET=$(get_asset_name "*_x64.app.tar.gz" "agm-alim_x64.app.tar.gz")
          WINDOWS_NSIS_ASSET=$(get_asset_name "*_x64-setup.exe" "agm-alim_${VER}_x64-setup.exe")
          LINUX_AMD64_ASSET=$(get_asset_name "*_amd64.AppImage" "agm-alim_${VER}_amd64.AppImage")
          LINUX_AARCH64_ASSET=$(get_asset_name "*_aarch64.AppImage" "agm-alim_${VER}_aarch64.AppImage")

          echo "Signatures found:"
          [ -n "$MACOS_AARCH64_SIG" ] && echo "  macOS aarch64: YES ($MACOS_AARCH64_ASSET)" || echo "  macOS aarch64: NO"
          [ -n "$MACOS_X64_SIG" ] && echo "  macOS x64: YES ($MACOS_X64_ASSET)" || echo "  macOS x64: NO"
          [ -n "$WINDOWS_NSIS_SIG" ] && echo "  Windows x64: YES ($WINDOWS_NSIS_ASSET)" || echo "  Windows x64: NO"
          [ -n "$LINUX_AMD64_SIG" ] && echo "  Linux amd64: YES ($LINUX_AMD64_ASSET)" || echo "  Linux amd64: NO"
          [ -n "$LINUX_AARCH64_SIG" ] && echo "  Linux aarch64: YES ($LINUX_AARCH64_ASSET)" || echo "  Linux aarch64: NO"

          # Build updater.json with platform-specific download URLs and signatures
          jq -n \
            --arg version "$VER" \
            --arg notes "See release page for details" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg mac_a64_sig "$MACOS_AARCH64_SIG" \
            --arg mac_x64_sig "$MACOS_X64_SIG" \
            --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
            --arg linux_amd64_sig "$LINUX_AMD64_SIG" \
            --arg linux_a64_sig "$LINUX_AARCH64_SIG" \
            --arg mac_a64_asset "$MACOS_AARCH64_ASSET" \
            --arg mac_x64_asset "$MACOS_X64_ASSET" \
            --arg win_nsis_asset "$WINDOWS_NSIS_ASSET" \
            --arg linux_amd64_asset "$LINUX_AMD64_ASSET" \
            --arg linux_a64_asset "$LINUX_AARCH64_ASSET" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: "\($dl)/\($mac_a64_asset)",
                  signature: $mac_a64_sig
                },
                "darwin-x86_64": {
                  url: "\($dl)/\($mac_x64_asset)",
                  signature: $mac_x64_sig
                },
                "windows-x86_64": {
                  url: "\($dl)/\($win_nsis_asset)",
                  signature: $win_nsis_sig
                },
                "linux-x86_64": {
                  url: "\($dl)/\($linux_amd64_asset)",
                  signature: $linux_amd64_sig
                },
                "linux-aarch64": {
                  url: "\($dl)/\($linux_a64_asset)",
                  signature: $linux_a64_sig
                }
              }
            }' > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files and generate checksums
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.rpm" -o \
            -name "*.app.tar.gz" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done
          # Copy standalone installer scripts and stamp pinned release version
          if [ -f install.ps1 ]; then
            sed "s/__PINNED_VERSION__/$VER/g" install.ps1 > release-files/install.ps1
          fi
          if [ -f install.sh ]; then
            sed "s/__PINNED_VERSION__/$VER/g" install.sh > release-files/install.sh
            chmod +x release-files/install.sh
          fi
          # Provide friendly alias names for direct setup/installer downloads
          cd release-files
          setup_file=$(find . -maxdepth 1 \( -name "agm-alim*setup.exe" -o -name "*setup.exe" \) | head -n 1)
          if [ -n "$setup_file" ] && [ -f "$setup_file" ]; then
            cp "$setup_file" agm-alim-setup.exe
          fi
          cd ..
          if [ -f releases-manifest.json ]; then
            cp releases-manifest.json release-files/
          fi
          cd release-files
          # Generate SHA-256 checksums
          sha256sum * > checksums.txt 2>/dev/null || shasum -a 256 * > checksums.txt 2>/dev/null || true
          cd ..
          find release-files -maxdepth 1 -type f -print

      # 使用 ncipollo/release-action 进行统一发布，支持稳健覆盖与 CLI 降级兜底
      - name: Create or Update GitHub Release
        id: create_release
        continue-on-error: true
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          allowUpdates: true
          tag: "${{ needs.verify-release-target.outputs.release_tag }}"
          name: "Antigravity Manager Tools By Alim ${{ needs.verify-release-target.outputs.release_tag }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          prerelease: ${{ needs.verify-release-target.outputs.is_prerelease == 'true' }}
          makeLatest: ${{ needs.verify-release-target.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}
          generateReleaseNotes: false

      - name: Verify or Upload GitHub Release via CLI Fallback
        if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && steps.create_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "release-action did not complete successfully (e.g. API rate limit). Checking release status..."
          EXTRA_FLAGS=""
          if [ "${{ needs.verify-release-target.outputs.is_prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi
          if ! gh release view "${{ needs.verify-release-target.outputs.release_tag }}" >/dev/null 2>&1; then
            gh release create "${{ needs.verify-release-target.outputs.release_tag }}" --title "Antigravity Manager Tools By Alim ${{ needs.verify-release-target.outputs.release_tag }}" --notes-file release_notes.md $EXTRA_FLAGS || true
          fi
          gh release upload "${{ needs.verify-release-target.outputs.release_tag }}" release-files/* updater.json --clobber || true
          gh release view "${{ needs.verify-release-target.outputs.release_tag }}" || true

      # 清理本次运行的中间 Artifacts 以维持零存储占用 (Release 资产已独立存放在 GitHub Releases)
      - name: Purge Run Artifacts Post-Release
        if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 03-ai-scripts/34-purge-github-actions-artifacts.py --repo "${{ github.repository }}" --artifacts-only || true

      # 预览版专属通道：同步镜像至 preview Tag Release，供应用内 Beta 通道稳定拉取 updater.json
      - name: Sync Preview Channel Release (Beta Only)
        if: needs.verify-release-target.outputs.is_prerelease == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: "preview"
          name: "Antigravity Tools Preview Channel (${{ needs.verify-release-target.outputs.release_tag }})"
          body: "Preview Channel build for version ${{ needs.verify-release-target.outputs.release_tag }}. Automatically synced for in-app Beta updater."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          generateReleaseNotes: false

  docker-build-amd64:
    needs: verify-release-target
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && vars.ENABLE_DOCKER_PUSH == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.repository_owner }}/antigravity-manager:latest-amd64
            ${{ github.repository_owner }}/antigravity-manager:${{ needs.verify-release-target.outputs.release_tag }}-amd64
          build-args: |
            USE_MIRROR=false

  docker-build-arm64:
    needs: verify-release-target
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request' && vars.ENABLE_DOCKER_PUSH == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ github.repository_owner }}/antigravity-manager:latest-arm64
            ${{ github.repository_owner }}/antigravity-manager:${{ needs.verify-release-target.outputs.release_tag }}-arm64
          build-args: |
            USE_MIRROR=false

  docker-manifest:
    needs: [verify-release-target, docker-build-amd64, docker-build-arm64]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && vars.ENABLE_DOCKER_PUSH == 'true'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          if [ "${{ needs.verify-release-target.outputs.is_prerelease }}" != "true" ]; then
            docker buildx imagetools create -t ${{ github.repository_owner }}/antigravity-manager:latest \
              ${{ github.repository_owner }}/antigravity-manager:latest-amd64 \
              ${{ github.repository_owner }}/antigravity-manager:latest-arm64
          fi

          docker buildx imagetools create -t ${{ github.repository_owner }}/antigravity-manager:${{ needs.verify-release-target.outputs.release_tag }} \
            ${{ github.repository_owner }}/antigravity-manager:${{ needs.verify-release-target.outputs.release_tag }}-amd64 \
            ${{ github.repository_owner }}/antigravity-manager:${{ needs.verify-release-target.outputs.release_tag }}-arm64
