[package]
name = "agm-alim"
version = "4.64.0"
default-run = "agm-alim"
description = "Antigravity Manager Tools by MD Alim Ul Karim and sponsored by RISE UP ASIA LLC"
authors = ["MD Alim Ul Karim <devorg.bd@gmail.com> (sponsored by RISE UP ASIA LLC)"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antigravity_tools_lib"
crate-type = ["rlib"]

[[bin]]
name = "agm-alim"
path = "src/main.rs"
test = false

[[bin]]
name = "agm"
path = "src/bin/agm.rs"
test = false

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "blocking", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
sysinfo = "0.31"
boring2 = "4.15.15"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
thiserror = "2.0.17"

# Reverse proxy service dependencies
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
socket2 = { version = "0.5", features = ["all"] }

hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
eventsource-stream = "0.2"
dashmap = "6.1"
anyhow = "1.0"
futures = "0.3"
rand = "0.8"                        # Generate sessionId and mock project_id
async-stream = "0.3.6"              # Simplify async stream generation
regex = "1.12.2"                    # Duration parsing
once_cell = "1.19"                  # Static initialization (model mapping table)
pin-project = "1.1"                 # Pin projection helper
bytes = "1.5"                       # SSE byte operations
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
libc = "0.2"
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
tauri-plugin-window-state = "2"
parking_lot = "0.12.5"
tokio-util = "0.7.18"
aes-gcm = "0.10.3"
machine-uid = "0.5.4"
plist = "1.7"
rquest = { version = "5.1.0", features = ["json", "stream", "socks", "cookies"] }
rquest-util = "2.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "abort"
strip = "symbols"
